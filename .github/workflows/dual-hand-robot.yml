name: Independent dual-hand robot project
on:
  push:
    branches: [dual-hand-robot-20261117]
    paths: [projects/dual_hand_robot/**, .github/workflows/dual-hand-robot.yml]
  pull_request:
    paths: [projects/dual_hand_robot/**, .github/workflows/dual-hand-robot.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pc:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.10'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: projects/dual_hand_robot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -S run_backpack.py --self-test
      - run: python -m left_hand_drive --upper --headless --demo
      - run: python -m left_hand_drive --check
      - if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/gui_robot_smoke.py
      - if: runner.os == 'Windows'
        run: python scripts/gui_robot_smoke.py
      - run: python scripts/build_packages.py
      - name: Verify imported backpack package without UART
        shell: python
        run: |
          from pathlib import Path
          import subprocess, sys, tempfile, zipfile
          with tempfile.TemporaryDirectory() as directory:
              with zipfile.ZipFile('releases/dual_hand_backpack_v1_20261117.zip') as archive:
                  archive.extractall(directory)
              package = Path(directory)/'aic_dual_hand_robot_20261117'
              subprocess.run([sys.executable, '-S', str(package/'verify_backpack.py')], check=True)
  backpack38:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: projects/dual_hand_robot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - run: python -S run_backpack.py --self-test
      - run: python -S run_backpack.py --check-deps
