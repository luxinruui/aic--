name: Verify AIC hand and chassis controls
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.10'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m aic_hand --check
      - run: python -m aic_hand --headless --demo --mode six --frames 150
      - if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/gui_smoke.py
      - if: runner.os == 'Windows'
        run: python scripts/gui_smoke.py
      - name: Test left-hand chassis controller
        working-directory: projects/left_hand_chassis
        run: python -m unittest discover -s tests -v
      - name: Check left-hand chassis model
        working-directory: projects/left_hand_chassis
        run: python -m left_hand_drive --check
      - name: Validate left-hand chassis lifecycle
        working-directory: projects/left_hand_chassis
        run: python -m left_hand_drive --headless --demo
      - if: runner.os == 'Linux'
        working-directory: projects/left_hand_chassis
        run: xvfb-run -a python scripts/gui_smoke.py
      - if: runner.os == 'Windows'
        working-directory: projects/left_hand_chassis
        run: python scripts/gui_smoke.py
      - name: Test backpack link with fake UART
        working-directory: projects/left_hand_chassis
        run: python -S run_backpack.py --self-test
      - name: Test MLK relay with simulated execution
        working-directory: projects/left_hand_chassis
        run: python -S run_mlk_relay.py --self-test
      - if: runner.os == 'Linux'
        working-directory: projects/left_hand_chassis
        run: xvfb-run -a python scripts/gui_robot_smoke.py
      - if: runner.os == 'Windows'
        working-directory: projects/left_hand_chassis
        run: python scripts/gui_robot_smoke.py
  embedded-python38:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Verify bundled dependency without site packages
        working-directory: projects/left_hand_chassis
        run: python -S run_backpack.py --check-deps
      - name: Test backpack standard-library runtime
        working-directory: projects/left_hand_chassis
        run: python -S run_backpack.py --self-test
      - name: Test board standard-library runtime
        working-directory: projects/left_hand_chassis
        run: python -S run_mlk_relay.py --self-test
