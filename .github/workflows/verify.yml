name: Verify PC hand preview
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.10'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m aic_hand --check
      - run: python -m aic_hand --headless --demo --mode six --frames 150
      - if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/gui_smoke.py
      - if: runner.os == 'Windows'
        run: python scripts/gui_smoke.py
